[project]
name = "insurance-charges-prediction"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "jupyter",
    "joblib"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]